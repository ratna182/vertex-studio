<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181615"/>
      <stop offset="50%" stop-color="#24211F"/>
      <stop offset="100%" stop-color="#121110"/>
    </linearGradient>

    <!-- Floor Gradient -->
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3632"/>
      <stop offset="100%" stop-color="#1C1A18"/>
    </linearGradient>

    <!-- Metallic Gold Glow -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>

    <!-- Neon Light Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Studio Background Wall -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Ambient Spotlight Aura -->
  <circle cx="600" cy="240" r="380" fill="#FFF1E6" opacity="0.08" filter="blur(60px)"/>
  <circle cx="600" cy="300" r="250" fill="#D4AF37" opacity="0.06" filter="blur(40px)"/>

  <!-- 3D Exhibition Floor -->
  <polygon points="100,520 1100,520 1200,675 0,675" fill="url(#floorGrad)"/>
  
  <!-- Floor Grid Perspective Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="200" y1="520" x2="100" y2="675"/>
    <line x1="400" y1="520" x2="350" y2="675"/>
    <line x1="600" y1="520" x2="600" y2="675"/>
    <line x1="800" y1="520" x2="850" y2="675"/>
    <line x1="1000" y1="520" x2="1100" y2="675"/>
    <line x1="50" y1="590" x2="1150" y2="590"/>
  </g>

  <!-- 3D EXHIBITION BOOTH STRUCTURE -->

  <!-- Back Wall Structure -->
  <rect x="280" y="160" width="640" height="340" rx="8" fill="#2D2A26" filter="url(#softShadow)"/>
  <rect x="290" y="170" width="620" height="320" rx="6" fill="#211F1D"/>

  <!-- Wooden Slat Panels (Left Wall) -->
  <g fill="#8C6D46">
    <rect x="310" y="190" width="12" height="280" rx="2"/>
    <rect x="330" y="190" width="12" height="280" rx="2"/>
    <rect x="350" y="190" width="12" height="280" rx="2"/>
    <rect x="370" y="190" width="12" height="280" rx="2"/>
    <rect x="390" y="190" width="12" height="280" rx="2"/>
  </g>

  <!-- Curved Architectural Roof Ceiling Canopy -->
  <path d="M 260 160 Q 600 100 940 160 L 910 200 Q 600 150 290 200 Z" fill="url(#goldGlow)" filter="url(#softShadow)"/>

  <!-- Downlight Spotlights under Ceiling -->
  <g fill="#FFFFFF" filter="url(#glow)">
    <circle cx="420" cy="180" r="6" opacity="0.9"/>
    <circle cx="600" cy="165" r="7" opacity="0.9"/>
    <circle cx="780" cy="180" r="6" opacity="0.9"/>
  </g>

  <!-- Spotlight Light Beams -->
  <polygon points="420,180 370,480 470,480" fill="#FFFFFF" opacity="0.04"/>
  <polygon points="600,165 530,480 670,480" fill="#FFFFFF" opacity="0.06"/>
  <polygon points="780,180 730,480 830,480" fill="#FFFFFF" opacity="0.04"/>

  <!-- 3D Illuminated Logo & Wall Branding -->
  <text x="600" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="url(#goldGlow)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">VERTEX STUDIO</text>
  <text x="600" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#A5A29D" text-anchor="middle" letter-spacing="6">EXHIBITION &amp; BOOTH DESIGN</text>

  <!-- Center Curved Reception Desk / Podium -->
  <path d="M 440 380 Q 600 350 760 380 L 740 480 Q 600 450 460 480 Z" fill="#2E2B27" filter="url(#softShadow)"/>
  <!-- Gold Accent Strip on Podium -->
  <path d="M 445 420 Q 600 395 755 420 L 753 432 Q 600 407 447 432 Z" fill="url(#goldGlow)"/>

  <!-- Side Display Showcase Pedestals with Floating Products -->
  <!-- Left Pedestal -->
  <rect x="330" y="390" width="70" height="90" fill="#3D3934" rx="4" filter="url(#softShadow)"/>
  <polygon points="330,390 365,375 400,390 365,405" fill="#524D46"/>
  <!-- Floating Glass Display Cube -->
  <rect x="345" y="340" width="40" height="40" fill="none" stroke="url(#goldGlow)" stroke-width="2" opacity="0.8"/>

  <!-- Right Pedestal -->
  <rect x="800" y="390" width="70" height="90" fill="#3D3934" rx="4" filter="url(#softShadow)"/>
  <polygon points="800,390 835,375 870,390 835,405" fill="#524D46"/>
  <!-- Floating Sphere Display -->
  <circle cx="835" cy="355" r="18" fill="url(#goldGlow)" opacity="0.8" filter="url(#glow)"/>

  <!-- Hanging Pendant Lights -->
  <line x1="480" y1="175" x2="480" y2="300" stroke="#8C6D46" stroke-width="2"/>
  <ellipse cx="480" cy="305" rx="14" ry="8" fill="url(#goldGlow)" filter="url(#glow)"/>

  <line x1="720" y1="175" x2="720" y2="300" stroke="#8C6D46" stroke-width="2"/>
  <ellipse cx="720" cy="305" rx="14" ry="8" fill="url(#goldGlow)" filter="url(#glow)"/>

  <!-- Tag / Watermark -->
  <rect x="940" y="590" width="210" height="36" rx="18" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
  <text x="1045" y="613" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle" letter-spacing="1">3D BOOTH RENDER</text>
</svg>
