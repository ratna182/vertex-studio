<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>VERTEX STUDIO - Working Drawing OG</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        padding: 44px;
        background:
          linear-gradient(rgba(243, 240, 230, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(243, 240, 230, 0.035) 1px,
            transparent 1px
          ),
          #13140e;
        background-size: 80px 80px;
        color: #f3f0e6;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .sheet {
        position: absolute;
        inset: 44px;
        border: 1px solid rgba(243, 240, 230, 0.22);
      }
      .sheet::before {
        content: "";
        position: absolute;
        inset: 22px;
        border: 1px solid rgba(243, 240, 230, 0.1);
      }
      .meta {
        position: absolute;
        left: 72px;
        right: 72px;
        display: flex;
        justify-content: space-between;
        font-family: Consolas, monospace;
        font-size: 17px;
        letter-spacing: 0.18em;
        color: #b4884f;
      }
      .top {
        top: 70px;
      }
      .bottom {
        bottom: 70px;
        color: #8b8a78;
      }
      .cross {
        position: absolute;
        font-family: Consolas, monospace;
        font-size: 30px;
        color: #d6a868;
      }
      .tl {
        top: 94px;
        left: 92px;
      }
      .tr {
        top: 94px;
        right: 92px;
      }
      .bl {
        bottom: 94px;
        left: 92px;
      }
      .br {
        bottom: 94px;
        right: 92px;
      }
      .center {
        position: absolute;
        left: 112px;
        right: 112px;
        top: 172px;
      }
      .label {
        font-family: Consolas, monospace;
        font-size: 18px;
        letter-spacing: 0.22em;
        color: #b4884f;
      }
      .wordmark {
        margin-top: 22px;
        font-size: 112px;
        line-height: 0.88;
        letter-spacing: -0.055em;
        font-weight: 700;
      }
      .subtitle {
        margin-top: 28px;
        max-width: 720px;
        font-size: 31px;
        line-height: 1.2;
        color: #a6a38f;
      }
      .line {
        position: absolute;
        left: 112px;
        right: 112px;
        top: 454px;
        height: 2px;
        background: #b4884f;
      }
      .title-block {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 104px;
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr 1fr;
        border: 1px solid rgba(243, 240, 230, 0.16);
      }
      .title-block div {
        padding: 10px 12px;
        border-right: 1px solid rgba(243, 240, 230, 0.1);
        font-family: Consolas, monospace;
        font-size: 14px;
        letter-spacing: 0.1em;
        color: #8b8a78;
      }
      .title-block div:last-child {
        border-right: 0;
      }
    </style>
  </head>
  <body>
    <div class="sheet"></div>
    <div class="meta top"><span>VS.OG-01</span><span>2026</span></div>
    <span class="cross tl">+</span><span class="cross tr">+</span
    ><span class="cross bl">+</span><span class="cross br">+</span>
    <main class="center">
      <div class="label">DIGITAL ARCHITECTURE / CREATIVE SOLUTIONS</div>
      <h1 class="wordmark">VERTEX<br />STUDIO</h1>
      <p class="subtitle">
        Presisi visual untuk render 3D, identitas brand, landing page, dan web
        portofolio.
      </p>
    </main>
    <div class="line"></div>
    <div class="title-block">
      <div>3D / BRAND / WEB</div>
      <div>INDONESIA</div>
      <div>REV. V2</div>
      <div>SKALA 1:1</div>
    </div>
    <div class="meta bottom">
      <span>vertex-studio-theta.vercel.app</span
      ><span>WORKING DRAWING SYSTEM</span>
    </div>
  </body>
</html>
