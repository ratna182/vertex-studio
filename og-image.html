<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VERTEX STUDIO — Digital Architecture & Creative Solutions</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background:
      radial-gradient(900px 560px at 90% 6%,   rgba(201, 168, 108, 0.16), transparent 55%),
      radial-gradient(820px 600px at 8% 96%,   rgba(58, 78, 128, 0.26), transparent 55%),
      radial-gradient(700px 480px at 50% 50%,  rgba(20, 25, 38, 0.4), transparent 62%),
      linear-gradient(178deg, #0B0F1A 0%, #0D1322 52%, #0B0F1A 100%);
    color: #F5F0E8;
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mesh { position: absolute; border-radius: 50%; pointer-events: none; }
  .mesh.gold {
    width: 480px; height: 480px; right: -140px; top: -150px;
    background: radial-gradient(circle, rgba(201, 168, 108, 0.24), rgba(201, 168, 108, 0) 68%);
    filter: blur(64px);
  }
  .mesh.blue {
    width: 560px; height: 560px; left: -180px; bottom: -220px;
    background: radial-gradient(circle, rgba(58, 78, 128, 0.30), rgba(58, 78, 128, 0) 70%);
    filter: blur(70px);
  }
  .mesh.core {
    width: 320px; height: 320px; right: 190px; top: 170px;
    background: radial-gradient(circle, rgba(201, 168, 108, 0.18), rgba(201, 168, 108, 0) 66%);
    filter: blur(48px);
  }

  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(245, 240, 232, 0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245, 240, 232, 0.022) 1px, transparent 1px);
    background-size: 120px 120px;
  }

  /* ---------- frame ---------- */
  .frame { position: absolute; inset: 30px; border: 1px solid rgba(201, 168, 108, 0.20); z-index: 3; pointer-events: none; }
  .corner { position: absolute; width: 26px; height: 26px; border: 0 solid #C9A86C; }
  .corner.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
  .corner.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
  .corner.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

  /* ---------- logo chip ---------- */
  .brandline { position: absolute; top: 62px; left: 76px; z-index: 2; }
  .chip {
    width: 48px; height: 48px; border-radius: 13px;
    background: rgba(20, 25, 38, 0.7);
    border: 1px solid rgba(201, 168, 108, 0.45);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 26px rgba(201, 168, 108, 0.16);
  }
  .chip svg { width: 27px; height: 27px; color: #C9A86C; }

  /* ---------- center text ---------- */
  .center { position: absolute; left: 0; right: 0; top: 168px; z-index: 2; text-align: center; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 14px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.34em;
    text-transform: uppercase; color: #C9A86C;
  }
  .eyebrow .line { width: 46px; height: 1px; background: rgba(201, 168, 108, 0.5); }

  .wordmark {
    margin-top: 26px;
    font-family: 'Georgia', 'Palatino Linotype', 'Times New Roman', serif;
    font-weight: 700;
    font-size: 148px;
    line-height: 0.98;
    letter-spacing: 0.01em;
    color: #F5F0E8;
    text-shadow: 0 6px 40px rgba(0, 0, 0, 0.55);
  }

  .wordmark-sub {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 600;
    font-size: 42px;
    line-height: 1;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #C9A86C;
    margin-top: 18px;
    margin-left: 21px;
    text-shadow: 0 0 34px rgba(201, 168, 108, 0.35);
  }

  .script {
    margin-top: 26px;
    font-family: 'Segoe Script', 'Monotype Corsiva', 'Brush Script MT', cursive;
    font-size: 46px;
    line-height: 1.1;
    color: #A08A5C;
  }

  /* ---------- decorative star ---------- */
  .star-big {
    position: absolute; right: 92px; top: 128px; z-index: 1;
    color: #C9A86C;
    filter: drop-shadow(0 0 30px rgba(201, 168, 108, 0.45));
  }
  .star-big svg { width: 120px; height: 120px; }
  .star-ring {
    position: absolute; right: 138px; top: 174px; z-index: 1;
    color: rgba(201, 168, 108, 0.35);
  }
  .star-ring svg { width: 28px; height: 28px; }

  /* ---------- footer ---------- */
  .footerline {
    position: absolute; left: 76px; right: 76px; bottom: 48px; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 16px;
    border-top: 1px solid rgba(201, 168, 108, 0.16);
    font-size: 13px; letter-spacing: 0.12em;
    color: rgba(184, 188, 200, 0.75);
  }
  .footerline .right { display: flex; align-items: center; gap: 10px; color: rgba(184, 188, 200, 0.6); }
  .footerline .right svg { width: 13px; height: 13px; color: #C9A86C; }

  /* ---------- grain ---------- */
  .grain { position: absolute; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: overlay; }
</style>
</head>
<body>

  <div class="mesh gold"></div>
  <div class="mesh blue"></div>
  <div class="mesh core"></div>
  <div class="grid"></div>

  <!-- logo chip -->
  <div class="brandline">
    <div class="chip">
      <svg viewBox="0 0 100 100" fill="currentColor">
        <path d="M50 0 L58 38 L96 46 L62 62 L74 98 L50 72 L26 98 L38 62 L4 46 L42 38 Z"/>
      </svg>
    </div>
  </div>

  <!-- decorative stars -->
  <div class="star-big" aria-hidden="true">
    <svg viewBox="0 0 100 100" fill="currentColor">
      <path d="M50 0 L58 38 L96 46 L62 62 L74 98 L50 72 L26 98 L38 62 L4 46 L42 38 Z"/>
    </svg>
  </div>
  <div class="star-ring" aria-hidden="true">
    <svg viewBox="0 0 100 100" fill="currentColor">
      <path d="M50 0 L58 38 L96 46 L62 62 L74 98 L50 72 L26 98 L38 62 L4 46 L42 38 Z"/>
    </svg>
  </div>

  <!-- center text -->
  <div class="center">
    <span class="eyebrow"><span class="line"></span>Digital Architecture &amp; Creative Solutions<span class="line"></span></span>
    <div class="wordmark">VERTEX</div>
    <div class="wordmark-sub">STUDIO</div>
    <div class="script">Crafting Digital Excellence</div>
  </div>

  <!-- frame -->
  <div class="frame">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
  </div>

  <!-- footer -->
  <div class="footerline">
    <span>vertex-studio-theta.vercel.app</span>
    <span class="right">
      <svg viewBox="0 0 100 100" fill="currentColor">
        <path d="M50 0 L58 38 L96 46 L62 62 L74 98 L50 72 L26 98 L38 62 L4 46 L42 38 Z"/>
      </svg>
      © 2026 VERTEX STUDIO
    </span>
  </div>

  <!-- grain -->
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="1200" height="630" filter="url(#noise)" opacity="0.05"/>
  </svg>

</body>
</html>
