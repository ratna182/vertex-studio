<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VERTEX STUDIO — Digital Architecture & Creative Solutions</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    background:
      radial-gradient(1000px 620px at 10% -8%,   rgba(56, 189, 248, 0.12), transparent 60%),
      radial-gradient(900px 560px at 94% 4%,     rgba(249, 115, 22, 0.20), transparent 55%),
      radial-gradient(1000px 760px at 48% 118%,  rgba(99, 102, 241, 0.18), transparent 60%),
      radial-gradient(640px 460px at -6% 108%,   rgba(45, 212, 191, 0.08), transparent 58%),
      linear-gradient(178deg, #0c1322 0%, #111827 52%, #182237 100%);
    color: #ffffff;
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- soft iridescent mesh blobs ---------- */
  .mesh { position: absolute; border-radius: 50%; pointer-events: none; }
  .mesh.orange {
    width: 520px; height: 520px; right: -150px; top: -130px;
    background: radial-gradient(circle, rgba(249, 115, 22, 0.28), rgba(249, 115, 22, 0) 68%);
    filter: blur(64px);
  }
  .mesh.indigo {
    width: 620px; height: 620px; left: -190px; bottom: -240px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.22), rgba(99, 102, 241, 0) 70%);
    filter: blur(70px);
  }
  .mesh.sky {
    width: 460px; height: 460px; right: 14%; bottom: -210px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.13), rgba(56, 189, 248, 0) 70%);
    filter: blur(60px);
  }
  .mesh.core {
    width: 300px; height: 300px; top: 150px; right: 268px;
    background: radial-gradient(circle, rgba(249, 115, 22, 0.22), rgba(249, 115, 22, 0) 66%);
    filter: blur(48px);
  }

  /* ---------- faint blueprint grid ---------- */
  .grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 120px 120px;
  }

  /* ---------- layout ---------- */
  .brandline { position: absolute; top: 62px; left: 76px; z-index: 2; }
  .chip {
    width: 48px; height: 48px; border-radius: 13px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px rgba(249, 115, 22, 0.14);
  }

  .textblock { position: absolute; top: 198px; left: 78px; z-index: 2; }

  .wordmark {
    font-family: 'Bahnschrift', 'Segoe UI', Arial, sans-serif;
    font-weight: 700;
    font-size: 116px;
    line-height: 0.94;
    letter-spacing: 0.005em;
    color: #ffffff;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .wordmark-sub {
    font-family: 'Bahnschrift', 'Segoe UI', Arial, sans-serif;
    font-weight: 600;
    font-size: 40px;
    line-height: 1;
    letter-spacing: 0.52em;
    text-transform: uppercase;
    color: #f97316;
    margin-top: 16px;
    margin-left: 10px;
    text-shadow: 0 0 32px rgba(249, 115, 22, 0.35);
    white-space: nowrap;
  }

  .tagline {
    margin-top: 30px;
    font-size: 19px;
    font-weight: 300;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.68);
    white-space: nowrap;
  }

  .services {
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13.5px;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: rgba(255, 255, 255, 0.52);
    white-space: nowrap;
  }
  .services i {
    width: 4px; height: 4px; border-radius: 50%;
    background: #f97316; flex: 0 0 auto;
  }

  /* ---------- right-side vertex constellation art ---------- */
  .art { position: absolute; right: 30px; top: 86px; width: 440px; height: 440px; z-index: 2; }
  .art .glow-star { filter: drop-shadow(0 0 28px rgba(249, 115, 22, 0.55)); }

  /* ---------- frame ---------- */
  .frame { position: absolute; inset: 30px; border: 1px solid rgba(255, 255, 255, 0.08); z-index: 3; pointer-events: none; }
  .corner { position: absolute; width: 26px; height: 26px; border: 0 solid #f97316; }
  .corner.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
  .corner.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
  .corner.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

  /* ---------- footer ---------- */
  .footerline {
    position: absolute; left: 76px; right: 76px; bottom: 48px; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    font-size: 13px; letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.4);
  }
  .footerline .right { display: flex; align-items: center; gap: 8px; color: rgba(255, 255, 255, 0.36); }

  /* ---------- film grain overlay ---------- */
  .grain { position: absolute; inset: 0; z-index: 4; pointer-events: none; mix-blend-mode: overlay; }
</style>
</head>
<body>

  <div class="mesh orange"></div>
  <div class="mesh indigo"></div>
  <div class="mesh sky"></div>
  <div class="mesh core"></div>
  <div class="grid"></div>

  <!-- logo chip -->
  <div class="brandline">
    <div class="chip">
      <svg viewBox="0 0 100 100" width="27" height="27">
        <path d="M50 0 L58 38 L96 46 L62 62 L74 98 L50 72 L26 98 L38 62 L4 46 L42 38 Z" fill="#f97316"/>
      </svg>
    </div>
  </div>

  <!-- left text -->
  <div class="textblock">
    <div class="wordmark">VERTEX</div>
    <div class="wordmark-sub">STUDIO</div>
    <div class="tagline">Digital Architecture &amp; Creative Solutions</div>
    <div class="services">
      <span>Web Custom</span><i></i>
      <span>Landing Page</span><i></i>
      <span>Kasir POS</span><i></i>
      <span>3D Rendering</span><i></i>
      <span>Desain Grafis</span><i></i>
      <span>Undangan Digital</span>
    </div>
  </div>

  <!-- right vertex constellation art -->
  <div class="art">
    <svg viewBox="0 0 520 520" width="440" height="440" fill="none">
      <!-- architecture triangle -->
      <g stroke="rgba(255,255,255,0.09)" stroke-width="1.6">
        <path d="M300 140 L70 470 L530 470 Z"/>
        <path d="M300 140 L300 36" stroke="rgba(255,255,255,0.05)"/>
      </g>
      <!-- dashed orbit ring -->
      <circle cx="300" cy="140" r="112" stroke="rgba(255,255,255,0.10)" stroke-width="1.3" stroke-dasharray="3 10"/>
      <!-- nodes -->
      <g fill="rgba(255,255,255,0.28)">
        <circle cx="415" cy="305" r="3"/>
        <circle cx="185" cy="305" r="3"/>
        <circle cx="300" cy="470" r="3"/>
        <circle cx="300" cy="36" r="2.5"/>
      </g>
      <!-- faint large outline star -->
      <g transform="translate(300 140) scale(2.1) translate(-300 -140)">
        <path d="M300 76 L319.1 120.9 L364 140 L319.1 159.1 L300 204 L280.9 159.1 L236 140 L280.9 120.9 Z"
              stroke="rgba(255,255,255,0.10)" stroke-width="1.4"/>
      </g>
      <!-- small accent stars -->
      <g fill="#f97316">
        <path opacity="0.55" d="M150 320 L153 327 L160 330 L153 333 L150 340 L147 333 L140 330 L147 327 Z"/>
        <path opacity="0.4"  d="M430 92 L431.6 96.6 L436.2 98.2 L431.6 99.8 L430 104.4 L428.4 99.8 L423.8 98.2 L428.4 96.6 Z"/>
      </g>
      <!-- main glowing star at the vertex -->
      <g class="glow-star">
        <path d="M300 76 L319.1 120.9 L364 140 L319.1 159.1 L300 204 L280.9 159.1 L236 140 L280.9 120.9 Z"
              fill="url(#starGrad)"/>
      </g>
      <defs>
        <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fb923c"/>
          <stop offset="0.55" stop-color="#f97316"/>
          <stop offset="1" stop-color="#c2410c"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- frame with orange corner ticks -->
  <div class="frame">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
  </div>

  <!-- footer -->
  <div class="footerline">
    <span>vertex-studio-theta.vercel.app</span>
    <span class="right">
      <svg viewBox="0 0 100 100" width="12" height="12">
        <path d="M50 0 L58 38 L96 46 L62 62 L74 98 L50 72 L26 98 L38 62 L4 46 L42 38 Z" fill="#f97316"/>
      </svg>
      © 2026 VERTEX STUDIO
    </span>
  </div>

  <!-- grain -->
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="1200" height="630" filter="url(#noise)" opacity="0.06"/>
  </svg>

</body>
</html>
