<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a2a"/>
      <stop offset="0.55" stop-color="#0B0F1A"/>
      <stop offset="1" stop-color="#070b13"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4B77A"/>
      <stop offset="0.5" stop-color="#C9A86C"/>
      <stop offset="1" stop-color="#A08A5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#C9A86C" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#C9A86C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded-square background -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="22.5" fill="none" stroke="rgba(201,168,108,0.28)" stroke-width="1.5"/>

  <!-- soft glow behind star -->
  <circle cx="50" cy="50" r="37" fill="url(#glow)"/>

  <!-- four-point sparkle star -->
  <g transform="translate(50 49) scale(0.86) translate(-50 -49)">
    <path d="M50 0 L58 38 L96 46 L62 62 L74 98 L50 72 L26 98 L38 62 L4 46 L42 38 Z" fill="url(#star)"/>
  </g>

  <!-- glint -->
  <circle cx="50" cy="49" r="3.2" fill="#F5F0E8" opacity="0.9"/>
</svg>
